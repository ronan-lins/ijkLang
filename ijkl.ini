; ==============================================================================
; ijkLang (ijkL) - Main Configuration File
; ==============================================================================

[general]
; Default source code language dictionary (e.g. en-US, pt-BR)
language = pt-BR

[directories]
; Directory containing language vocabulary files (*.words)
keywords = keywords
; Directory containing standard library/framework units (*.ijk)
framework = lib

[compiler]
; Strict diagnostic mode (true/false)
strict = false
